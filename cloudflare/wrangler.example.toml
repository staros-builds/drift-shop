# Vendra front-door Worker — example Wrangler config.
# Copy to wrangler.toml only during the Cloudflare setup step, after the
# apex domain is registered and its DNS zone is active on Cloudflare.
# No secrets belong in this file; the Resend/Supabase keys never go here.

name = "vendra-front-door"
main = "front-door-worker.js"
compatibility_date = "2026-10-01"

# The Cloudflare Pages hostname that serves the identical Vendra build.
# Replace with the real <project>.pages.dev host during setup.
[vars]
ORIGIN_HOST = "REPLACE_ME.pages.dev"

# Routes are added only after the apex is known. One level only:
# shop subdomains are `<shop>.<apex>`; deeper names are not shops.
# [[routes]]
# pattern = "REPLACE_ME_APEX/*"
# zone_name = "REPLACE_ME_APEX"
#
# [[routes]]
# pattern = "*.REPLACE_ME_APEX/*"
# zone_name = "REPLACE_ME_APEX"
