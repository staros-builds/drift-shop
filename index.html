    <!--
      Content-Security-Policy (delivered via meta because GitHub Pages
      cannot set response headers). Everything the built app loads is
      same-origin; the only network calls are to the shop's Supabase
      project (REST/auth/Realtime) and user content the operator chose
      (product photos, web-app embeds). Images and frames are the two
      deliberately broad allowances: product images are pasted as
      arbitrary https URLs and the Web App viewer embeds user-saved
      sites — neither can execute script, and `script-src 'self'`
      (no 'unsafe-inline') is what keeps a stored XSS in those surfaces
      from running code. Inline scripts are banned, so the 404.html
      deep-link restore lives at the top of src/main.jsx instead.
      `object-src 'none'` blocks plugin embeds; base-uri/form-action
      pin navigation hijack vectors to this origin.
      Google sign-in (accounts.google.com) and the Google Drive API
      (www.googleapis.com / oauth2.googleapis.com) are allowed on top of
      that, but only for the OPTIONAL cloud backup in Settings: sign-in
      opens Google's own page, and Drive receives backup files with a
      token that can only touch files Drift Shop itself creates.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self'; connect-src 'self' https://mkbozzeucotbxilkpapd.supabase.co wss://mkbozzeucotbxilkpapd.supabase.co https://accounts.google.com https://www.googleapis.com https://oauth2.googleapis.com; worker-src 'self'; frame-src https: http: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Vendra — point of sale, catalogue, team and files in one calm app. Installable; runs entirely on your shop's online account."
    />

    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
